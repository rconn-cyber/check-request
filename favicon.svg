<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background circle -->
  <circle cx="16" cy="16" r="16" fill="#1a2744"/>
  <!-- Gold border ring -->
  <circle cx="16" cy="16" r="16" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  
  <!-- Saber 1: top-left to bottom-right -->
  <!-- Blade -->
  <line x1="7" y1="7" x2="25" y2="25" stroke="#c9a227" stroke-width="2" stroke-linecap="round"/>
  <!-- Guard crosspiece -->
  <line x1="9.5" y1="12" x2="14" y2="7.5" stroke="#c9a227" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="7" y1="7" x2="5" y2="5" stroke="#c9a227" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Saber 2: top-right to bottom-left -->
  <!-- Blade -->
  <line x1="25" y1="7" x2="7" y2="25" stroke="#c9a227" stroke-width="2" stroke-linecap="round"/>
  <!-- Guard crosspiece -->
  <line x1="22.5" y1="12" x2="18" y2="7.5" stroke="#c9a227" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="25" y1="7" x2="27" y2="5" stroke="#c9a227" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Center star/rivet -->
  <circle cx="16" cy="16" r="1.8" fill="#c9a227"/>
</svg>